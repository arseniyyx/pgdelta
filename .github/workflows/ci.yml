name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGDELTA_FROM_DSN: postgresql://postgres:postgres@localhost:5432/pgdelta_src
      PGDELTA_TO_DSN: postgresql://postgres:postgres@localhost:5432/pgdelta_dst
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Create the two test databases
        run: |
          uv run python - <<'PY'
          import psycopg
          conn = psycopg.connect("postgresql://postgres:postgres@localhost:5432/postgres", autocommit=True)
          for db in ("pgdelta_src", "pgdelta_dst"):
              conn.execute(f'CREATE DATABASE {db}')
          PY
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pgdelta .
