[project]
name = "pgdelta"
version = "0.1.0"
description = "Diff two PostgreSQL schemas and lint the migration for operations that lock or rewrite tables"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlparse>=0.5",
]

[project.scripts]
pgdelta = "pgdelta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
